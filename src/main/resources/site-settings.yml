# ============================================================================
# Configuración de negocio por sitio — catálogo de claves y valores por defecto
# Épica EP-20260909 (Configuración, catálogos e i18n), Fase 3.
# ----------------------------------------------------------------------------
# Categoría C de la épica: reglas de negocio que cambian por finca/sitio, no
# con releases (a diferencia de catalog.yml) y no son copy de UI.
#
# Cada clave define su tipo, valor por defecto, etiqueta y grupo. El valor
# vigente se persiste en SiteSettingItem (versionado, con historial). Si un
# sitio no tiene valor almacenado, el endpoint responde con el `default` de
# aquí y `source: DEFAULT`.
#
# SiteSettingsCatalog valida al arrancar: claves únicas, `type` válido y
# `default` coherente con el tipo (guardia anti-deriva).
# ============================================================================

version: "2026-09-09"

settings:

  - key: GESTATION_DAYS
    type: NUMBER
    default: 279
    label: "Días de gestación (referencia para estimar el parto)"
    group: reproduccion
    min: 150
    max: 400

  # --- Tareas del ciclo reproductivo (HU-20260929-tareas-ciclo-reproductivo) ---
  # Valores por defecto referenciales; confirmar con el veterinario de la finca (P5).

  - key: PREGNANCY_CHECK_DAYS
    type: NUMBER
    default: 40
    label: "Días tras el servicio para diagnosticar preñez"
    group: reproduccion
    min: 25
    max: 90

  - key: PREGNANCY_RECHECK_DAYS
    type: NUMBER
    default: 15
    label: "Días para repetir un diagnóstico de preñez dudoso"
    group: reproduccion
    min: 7
    max: 60

  - key: DRY_OFF_BEFORE_CALVING_DAYS
    type: NUMBER
    default: 60
    label: "Días antes del parto para secar la vaca"
    group: reproduccion
    min: 30
    max: 90

  - key: PREPARTUM_BEFORE_CALVING_DAYS
    type: NUMBER
    default: 21
    label: "Días antes del parto para el manejo preparto"
    group: reproduccion
    min: 7
    max: 45

  - key: POSTPARTUM_CHECK_DAYS
    type: NUMBER
    default: 21
    label: "Días después del parto para el control posparto"
    group: reproduccion
    min: 7
    max: 60

  - key: VOLUNTARY_WAITING_DAYS
    type: NUMBER
    default: 60
    label: "Periodo voluntario de espera tras parto o aborto (días)"
    group: reproduccion
    min: 30
    max: 120

  - key: SERVICE_FOLLOWUP_ORANGE_DAYS
    type: NUMBER
    default: 42
    label: "Semáforo post-servicio: días para pasar a naranja"
    group: reproduccion
    min: 21
    max: 120

  - key: SERVICE_FOLLOWUP_RED_DAYS
    type: NUMBER
    default: 63
    label: "Semáforo post-servicio: días para pasar a rojo"
    group: reproduccion
    min: 22
    max: 180

  - key: REPEAT_BREEDER_SERVICES
    type: NUMBER
    default: 3
    label: "Servicios sin preñez desde el último parto para marcar repetidora"
    group: reproduccion
    min: 2
    max: 10

  - key: ROTATION_SEMAPHORE_YELLOW_DAYS
    type: NUMBER
    default: 3
    label: "Semáforo de rotación: días restantes para marcar 'próximo' (amarillo)"
    group: potreros
    min: 0
    max: 60

  - key: PASTURE_TARGET_RESIDUAL_CM
    type: NUMBER
    default: 5
    label: "Residual objetivo de pastoreo (cm)"
    group: potreros
    min: 0
    max: 30

  - key: BOVINE_EVENT_HISTORY_LIMIT
    type: NUMBER
    default: 200
    label: "Límite de eventos mostrados en el historial bovino"
    group: bovinos
    min: 10
    max: 1000

  - key: MILK_PRICE_PER_LITER
    type: NUMBER
    default: 0
    label: "Precio de leche por litro"
    group: leche
    min: 0
