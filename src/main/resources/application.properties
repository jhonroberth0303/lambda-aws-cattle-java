# Reduce logging level to make sure the application works with SAM local
# https://github.com/aws/serverless-java-container/issues/134
logging.level.root=WARN

# External YAML configuration files
spring.config.import=classpath:bovine-category-rules.yaml

# Bedrock Configuration
bedrock.model.id=anthropic.claude-3-haiku-20240307-v1:0
aws.region=us-east-1

# OpenAPI / Swagger Configuration
app.version=1.0.0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# CORS Configuration
# Orígenes permitidos (separados por coma). En producción usar variable de entorno.
# Ejemplos:
#   - Desarrollo local: http://localhost:3000,http://localhost:5173
#   - Producción: https://cattle-app.com,https://admin.cattle-app.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.max-age=3600

# JWT Security Configuration
# En producción usar variable de entorno JWT_SECRET (mínimo 256 bits / 32 caracteres)
jwt.secret=${JWT_SECRET:cattle-development-secret-key-minimum-256-bits-32-chars}
jwt.issuer=${JWT_ISSUER:cattle-app}
jwt.validate-issuer=false

# Security Configuration
# Deshabilitar para desarrollo local si no se tiene JWT configurado
security.enabled=${SECURITY_ENABLED:false}

# Rate Limiting Configuration
rate.limit.requests.per.hour=${RATE_LIMIT_PER_HOUR:100}