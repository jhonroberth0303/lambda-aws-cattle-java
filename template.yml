AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Serverless Spring Boot 2 API - com.cattle::cattle-bovines-functions-aws

# ============================================================================
# PARÁMETROS - Configurables por ambiente (DEV/PROD)
# ============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Ambiente de despliegue

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: ID del modelo de Bedrock para el chatbot

  BedrockKnowledgeBaseModelArn:
    Type: String
    Default: arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
    Description: ARN del modelo para Knowledge Base

  CorsAllowedOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:5173,https://ambitious-tree-021c81b10.4.azurestaticapps.net
    Description: Orígenes permitidos para CORS (separados por coma)

  SecurityEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Habilitar seguridad JWT

  RateLimitPerHour:
    Type: Number
    Default: 100
    Description: Límite de requests por hora por finca

  AppTimezone:
    Type: String
    Default: America/Bogota
    Description: Zona horaria operativa de la aplicación y jobs programados

  SummaryRefreshScheduleExpression:
    Type: String
    Default: cron(0 3 * * ? *)
    Description: Expresión cron del refresh batch de summaries

  NotificationMorningScheduleExpression:
    Type: String
    Default: cron(0 9 * * ? *)
    Description: Cron de la ventana MORNING de notificaciones (recordatorio de ordeño AM)

  NotificationMilkingSiteId:
    Type: String
    Default: '001'
    Description: Site con el que el recordatorio de ordeño consulta los datos de ordeño

  NotificationMilkingFarmId:
    Type: String
    Default: F001
    Description: Finca destinataria del recordatorio de ordeño (debe coincidir con el farmId de la campana)

  TableBovines:
    Type: String
    Default: Bovines
    Description: Nombre de la tabla DynamoDB de bovinos y summary

  TableFarmMilking:
    Type: String
    Default: MilkingRecords
    Description: Nombre de la tabla DynamoDB de registros de ordeño

  TablePasture:
    Type: String
    Default: Pastures
    Description: Nombre de la tabla DynamoDB de potreros

  TablePlan:
    Type: String
    Default: Plans
    Description: Nombre de la tabla DynamoDB de planes

  TableCounters:
    Type: String
    Default: counters
    Description: Nombre de la tabla DynamoDB de contadores

  TableSiteSettings:
    Type: String
    Default: SiteSettings
    Description: Nombre de la tabla DynamoDB de configuraciones reutilizables por sitio

  TableEvents:
    Type: String
    Default: Events
    Description: Nombre de la tabla DynamoDB de eventos para auditoría y tracking

  TableNotifications:
    Type: String
    Default: notifications-prod
    Description: Nombre de la tabla DynamoDB de notificaciones in-app (creada fuera del stack, como el resto)

Globals:
  Api:
    EndpointConfiguration: REGIONAL
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Request-Id'"
      AllowOrigin: "'*'"
      MaxAge: "'3600'"

Resources:
  # IAM Role para Lambda
  CattleLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaDynamoDBExecutionRole
        - arn:aws:iam::aws:policy/AWSLambdaExecute
      Policies:
        - PolicyName: cattle-bedrock-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock permissions (igualando la lambda anterior)
              - Sid: BedrockInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - 'arn:aws:bedrock:*:730335402740:provisioned-model/*'
                  - 'arn:aws:bedrock:*:730335402740:imported-model/*'
                  - 'arn:aws:bedrock:*:730335402740:marketplace/model-endpoint/all-access'
                  - 'arn:aws:bedrock:*:730335402740:custom-model-deployment/*'

              # Bedrock List Models
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                Resource: '*'

              # Bedrock Knowledge Base permissions
              - Sid: BedrockKnowledgeBase
                Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                  - bedrock:Retrieve
                Resource:
                  - 'arn:aws:bedrock:*:*:knowledge-base/*'

  # NOTA: todas las tablas de datos (bovines-prod, milking-records-prod, site-settings-prod,
  # events-prod, ...) se crean fuera del stack con los scripts de
  # src/main/resources/scripts/create-scripts.txt. El stack solo las referencia por nombre
  # vía los parámetros Table*.

  # NOTA: la tabla de notificaciones (notifications-prod) se crea fuera del stack, igual
  # que bovines-prod / milking-records-prod / etc. Script en
  # docs/arquitectura/modulo-notificaciones.md -> "Creación de la tabla".

  # Lambda Function
  CattleBovinesFunctionsAwsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cattle-lambda-function
      Role: !GetAtt CattleLambdaRole.Arn
      Handler: com.cattle.StreamLambdaHandler::handleRequest
      Runtime: java21
      CodeUri: build/distributions/cattle-lambda-function.zip
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_KB_MODEL_ARN: !Ref BedrockKnowledgeBaseModelArn
          # Application Configuration
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          SECURITY_ENABLED: !Ref SecurityEnabled
          RATE_LIMIT_PER_HOUR: !Ref RateLimitPerHour
          TABLE_BOVINES: !Ref TableBovines
          TABLE_FARM_MILKING: !Ref TableFarmMilking
          TABLE_PASTURE: !Ref TablePasture
          TABLE_PLAN: !Ref TablePlan
          TABLE_COUNTERS: !Ref TableCounters
          TABLE_SITE_SETTINGS: !Ref TableSiteSettings
          TABLE_EVENTS: !Ref TableEvents
          TABLE_NOTIFICATIONS: !Ref TableNotifications
      Events:
        ProxyResource:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any

  SummaryRefreshSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cattle-summary-refresh-scheduler
      Role: !GetAtt CattleLambdaRole.Arn
      Handler: com.cattle.SummaryRefreshSchedulerHandler::handleRequest
      Runtime: java21
      CodeUri: build/distributions/cattle-lambda-function.zip
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_KB_MODEL_ARN: !Ref BedrockKnowledgeBaseModelArn
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          SECURITY_ENABLED: !Ref SecurityEnabled
          RATE_LIMIT_PER_HOUR: !Ref RateLimitPerHour
          TABLE_BOVINES: !Ref TableBovines
          TABLE_FARM_MILKING: !Ref TableFarmMilking
          TABLE_PASTURE: !Ref TablePasture
          TABLE_PLAN: !Ref TablePlan
          TABLE_COUNTERS: !Ref TableCounters
          TABLE_SITE_SETTINGS: !Ref TableSiteSettings
          TABLE_EVENTS: !Ref TableEvents
          TABLE_NOTIFICATIONS: !Ref TableNotifications

  SummaryRefreshSchedulerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cattle-summary-refresh-scheduler-dlq
      MessageRetentionPeriod: 1209600

  SummaryRefreshSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: summary-refresh-scheduler-targets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt SummaryRefreshSchedulerFunction.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SummaryRefreshSchedulerDlq.Arn

  SummaryRefreshDailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Daily refresh of bovine summaries at 3 AM
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref SummaryRefreshScheduleExpression
      ScheduleExpressionTimezone: !Ref AppTimezone
      State: ENABLED
      Target:
        Arn: !GetAtt SummaryRefreshSchedulerFunction.Arn
        RoleArn: !GetAtt SummaryRefreshSchedulerExecutionRole.Arn
        Input: '{"source":"eventbridge.scheduler","job":"summary-refresh"}'
        DeadLetterConfig:
          Arn: !GetAtt SummaryRefreshSchedulerDlq.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  # ==========================================================================
  # Plataforma de notificaciones — Lambda programada + schedules por ventana
  # ==========================================================================
  NotificationSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cattle-notification-scheduler
      Role: !GetAtt CattleLambdaRole.Arn
      Handler: com.cattle.NotificationSchedulerHandler::handleRequest
      Runtime: java21
      CodeUri: build/distributions/cattle-lambda-function.zip
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_KB_MODEL_ARN: !Ref BedrockKnowledgeBaseModelArn
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          SECURITY_ENABLED: !Ref SecurityEnabled
          RATE_LIMIT_PER_HOUR: !Ref RateLimitPerHour
          TABLE_BOVINES: !Ref TableBovines
          TABLE_FARM_MILKING: !Ref TableFarmMilking
          TABLE_PASTURE: !Ref TablePasture
          TABLE_PLAN: !Ref TablePlan
          TABLE_COUNTERS: !Ref TableCounters
          TABLE_SITE_SETTINGS: !Ref TableSiteSettings
          TABLE_EVENTS: !Ref TableEvents
          TABLE_NOTIFICATIONS: !Ref TableNotifications
          NOTIFICATION_MILKING_SITE_ID: !Ref NotificationMilkingSiteId
          NOTIFICATION_MILKING_FARM_ID: !Ref NotificationMilkingFarmId

  NotificationSchedulerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cattle-notification-scheduler-dlq
      MessageRetentionPeriod: 1209600

  NotificationSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notification-scheduler-targets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt NotificationSchedulerFunction.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt NotificationSchedulerDlq.Arn

  # Ventana MORNING (09:00): recordatorio del ordeño AM.
  # Cada productor nuevo con hora distinta añade su propio Schedule apuntando a esta misma función.
  NotificationMorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Notification producers for the MORNING window (AM milking reminder)
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref NotificationMorningScheduleExpression
      ScheduleExpressionTimezone: !Ref AppTimezone
      State: ENABLED
      Target:
        Arn: !GetAtt NotificationSchedulerFunction.Arn
        RoleArn: !GetAtt NotificationSchedulerExecutionRole.Arn
        Input: '{"source":"eventbridge.scheduler","window":"MORNING"}'
        DeadLetterConfig:
          Arn: !GetAtt NotificationSchedulerDlq.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

Outputs:
  CattleBovinesFunctionsAwsApi:
    Description: URL for application
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/ping'
    Export:
      Name: CattleBovinesFunctionsAwsApi

  SummaryRefreshSchedulerFunctionName:
    Description: Nombre de la Lambda dedicada al refresh diario de summaries
    Value: !Ref SummaryRefreshSchedulerFunction

  SummaryRefreshSchedulerDlqArn:
    Description: ARN de la cola DLQ del scheduler de refresh summary
    Value: !GetAtt SummaryRefreshSchedulerDlq.Arn

  NotificationSchedulerFunctionName:
    Description: Nombre de la Lambda programada de la plataforma de notificaciones
    Value: !Ref NotificationSchedulerFunction

  NotificationSchedulerDlqArn:
    Description: ARN de la cola DLQ del scheduler de notificaciones
    Value: !GetAtt NotificationSchedulerDlq.Arn
