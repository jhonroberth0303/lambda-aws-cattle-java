version = 0.1

[default.deploy.parameters]
stack_name = "cattle-lambda-function"
resolve_s3 = true
s3_prefix = "cattle-lambda-function"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"
disable_rollback = false
parameter_overrides = """
  Environment="dev" \
  BedrockModelId="anthropic.claude-3-haiku-20240307-v1:0" \
  BedrockKnowledgeBaseModelArn="arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0" \
  CorsAllowedOrigins="http://localhost:3000,http://localhost:5173,https://ambitious-tree-021c81b10.4.azurestaticapps.net" \
  SecurityEnabled="false" \
  RateLimitPerHour="100" \
  TableBovines="Bovines" \
  TableFarmMilking="MilkingRecords" \
  TablePasture="Pastures" \
  TablePlan="Plans" \
  TableCounters="counters" \
  TableSiteSettings="SiteSettings"
"""
